spring.application.name=gestao-pedidos

# Banco H2 em memória (os dados são recriados a cada execução)
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carrega data.sql depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
